<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芯片齐套管理系统 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{text-align:center;margin-bottom:8px;font-size:24px;color:#1a1a2e}
.login-box .sub{text-align:center;color:#999;margin-bottom:30px;font-size:14px}
.form-g{margin-bottom:16px}
.form-g label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#555}
.form-g input{width:100%;padding:10px 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none}
.form-g input:focus{border-color:#3b82f6}
.btn{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{background:#2563eb}
.error{color:#ef4444;text-align:center;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="login-box">
  <h1>🦞 芯片齐套管理</h1>
  <div class="sub">请输入邮箱和密码登录</div>
  <div class="form-g"><label>邮箱</label><input type="email" id="login-email" placeholder="your@casue.com" autofocus></div>
  <div class="form-g"><label>密码</label><input type="password" id="login-pw" placeholder="输入密码"></div>
  <button class="btn" onclick="login()">登 录</button>
  <div id="login-error" class="error"></div>
</div>
<script>
const API = '';

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value.trim();
  const err = document.getElementById('login-error');
  if (!email || !pw) { err.textContent = '请填写邮箱和密码'; return; }

  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('chipkit_user', JSON.stringify(d.user));
      location.href = '/index.html';
    } else {
      err.textContent = d.error || '登录失败';
    }
  } catch (e) {
    err.textContent = '无法连接服务器';
  }
}

document.getElementById('login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
