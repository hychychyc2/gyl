<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芯片齐套管理系统 v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f5;--sb:#1a1a2e;--sbt:#a0a0b8;--sba:#fff;--p:#3b82f6;--d:#ef4444;--s:#10b981;--w:#f59e0b;--c:#fff;--b:#e5e7eb;--t:#1f2937;--ts:#6b7280}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);display:flex;height:100vh;overflow:hidden}
#sb{width:220px;background:var(--sb);overflow-y:auto;flex-shrink:0}
#sb-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.nav-item{padding:10px 16px;cursor:pointer;color:var(--sbt);font-size:13px;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.05);color:#ddd}
.nav-item.active{background:rgba(59,130,246,.15);color:var(--sba);border-left-color:var(--p)}
#main{flex:1;overflow-y:auto;padding:20px}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--ts)}
.error{color:var(--d);padding:16px;background:#fef2f2;border-radius:8px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar h2{font-size:18px;white-space:nowrap}
.toolbar-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:6px 10px;border:1px solid var(--b);border-radius:6px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--c);border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-val{font-size:26px;font-weight:700}
.card-lbl{font-size:12px;color:var(--ts);margin-top:4px}
.dt-container{background:var(--c);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:auto}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:#f9fafb;padding:8px 10px;text-align:left;font-weight:600;color:var(--ts);border-bottom:2px solid var(--b);position:sticky;top:0;z-index:1;white-space:nowrap}
.dt td{padding:6px 10px;border-bottom:1px solid var(--b);white-space:nowrap;max-width:250px;overflow:hidden;text-overflow:ellipsis}
.dt tr:hover{background:#f9fafb}
.action-cell{display:flex;gap:4px}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;font-weight:500}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:#2563eb}
.btn-s{background:#e5e7eb;color:var(--t)}.btn-s:hover{background:#d1d5db}
.btn-o{border:1px solid var(--b);background:transparent}.btn-o:hover{background:#f3f4f6}
.btn-d{background:var(--d);color:#fff}.btn-d:hover{background:#dc2626}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-xs{padding:2px 6px;font-size:11px}
.form-g{margin-bottom:12px}
.form-g label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--ts)}
.form-g input,.form-g select{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:6px;font-size:14px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:#fff;border-radius:12px;padding:20px;min-width:400px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-lg{min-width:500px}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--b)}
.tab{padding:8px 16px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--ts);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab:hover{color:var(--t)}
.tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:600}
.toast{position:fixed;top:16px;right:16px;padding:10px 18px;border-radius:8px;color:#fff;font-size:13px;z-index:2000;transition:opacity .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-info{background:var(--p)}.toast-success{background:var(--s)}.toast-error{background:var(--d)}
.stat-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stat-item{background:var(--c);padding:10px 14px;border-radius:6px;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stat-item b{font-size:16px;color:var(--p)}
@media(max-width:768px){#sb{width:55px}.nav-item{padding:10px 6px;text-align:center;font-size:11px}#sb-logo{font-size:12px;padding:10px 6px}}
</style>
</head>
<body>
<aside id="sb">
  <div id="sb-logo">🦞 齐套管理</div>
  <nav id="nav-menu"></nav>
</aside>
<main id="main"><div class="loading">加载中...</div></main>
<script src="app.js"></script>
</body>
</html>
